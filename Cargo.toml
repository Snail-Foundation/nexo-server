[package]
name = "nexo-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
description = "Nexo local sync, auth, and waiter/kitchen web server"
license = "MIT"
publish = false

[dependencies]
argon2 = "0.5"
askama = "0.16"
axum = "0.8"
axum-extra = { version = "0.12", features = ["cookie"] }
chrono = "0.4"
form_urlencoded = "1"
hex = "0.4"
nexo-core = { path = "../nexo-core" }
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
thiserror = "2"
time = "0.3"
tokio = { version = "1", features = [
    "fs",
    "io-util",
    "macros",
    "rt-multi-thread",
    "net",
    "signal",
    "sync",
    "time",
] }
tower-http = { version = "0.7", features = ["trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
